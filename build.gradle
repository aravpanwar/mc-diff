plugins {
	id 'net.fabricmc.fabric-loom-remap' version "${loom_version}"
}

base {
	archivesName = 'mc-diff'
}

version = "${project.mod_version}+${project.minecraft_version}"

repositories {
	maven {
		name = 'Nucleoid'
		url = 'https://maven.nucleoid.xyz/'
	}
}

dependencies {
	minecraft "com.mojang:minecraft:${project.minecraft_version}"
	mappings loom.officialMojangMappings()
	modImplementation "net.fabricmc:fabric-loader:${project.loader_version}"
	modImplementation "net.fabricmc.fabric-api:fabric-api:${project.fabric_api_version}"
	modImplementation "xyz.nucleoid:fantasy:${project.fantasy_version}"
	include "xyz.nucleoid:fantasy:${project.fantasy_version}"
}

processResources {
	def version = project.version
	inputs.property "version", version

	filesMatching("fabric.mod.json") {
		expand "version": version
	}
}

tasks.withType(JavaCompile).configureEach {
	it.options.release = 21
}

java {
	sourceCompatibility = JavaVersion.VERSION_21
	targetCompatibility = JavaVersion.VERSION_21
}

tasks.register('installToPrism', Copy) {
	def mods = file("${System.getenv('APPDATA')}/PrismLauncher/instances/mc-diff-1.21.1/.minecraft/mods")
	from remapJar.archiveFile
	into mods
	dependsOn remapJar
	doFirst {
		mods.listFiles()?.findAll { it.name.startsWith('mc-diff-') && it.name.endsWith('.jar') }?.each { it.delete() }
	}
}

jar {
	from("LICENSE") {
		rename { "${it}_mc-diff" }
	}
}
